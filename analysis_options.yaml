include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/gen/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    invalid_annotation_target: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

plugins:
  riverpod_lint: ^3.1.9

linter:
  rules:
    # Docs on every public member is noise for an app (not a library).
    public_member_api_docs: false
    # Long lines are fine for ARB-driven UI code; formatter handles wrapping.
    lines_longer_than_80_chars: false
    # Keep conventional `ClassName(...)` constructors for readability.
    unnecessary_type_name_in_constructor: false
